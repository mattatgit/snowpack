name: Historical Weather POC
# Pages deployment enabled

on:
  push:
    branches:
      - prototype/furanodake-poc
    paths:
      - "config/furanodake-weather.json"
      - "config/furanodake.json"
      - "config/furanodake-features.json"
      - "pipeline/landcover/**"
      - "pipeline/weather/**"
      - "pipeline/terrain/**"
      - "pipeline/web/**"
      - "tests/test_weather.py"
      - "pyproject.toml"
      - "web/**"
      - ".github/workflows/historical-weather-poc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "snowpack-pages"
  cancel-in-progress: true

jobs:
  build-historical-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Build terrain dependency
        run: python -m pipeline.terrain.build_furanodake
      - name: Probe DEM1A coverage
        run: python -m pipeline.terrain.probe_dem1a
      - name: Build historical weather forcing
        run: python -m pipeline.weather.build_historical_forcing
      - name: Export terrain for viewer
        run: python -m pipeline.terrain.export_web
      - name: Export progressive terrain LOD
        run: python -m pipeline.terrain.export_lod
      - name: Export terrain labels
        run: python -m pipeline.terrain.export_features
      - name: Export forest cover for viewer
        run: python -m pipeline.landcover.worldcover
      - name: Export historical weather for viewer
        run: python -m pipeline.weather.export_web
      - name: Apply viewer presentation tweaks
        run: python -m pipeline.web.patch_viewer
      - name: Apply controlled sky and mobile accordion
        run: python -m pipeline.web.patch_sky
      - name: Refine topo contours and wind animation
        run: python -m pipeline.web.patch_refine
      - name: Optimize viewer for mobile WebGL
        run: python -m pipeline.web.patch_mobile
      - name: Refine wind into smoothed airflow
        run: python -m pipeline.web.patch_airflow
      - name: Apply progressive terrain LOD
        run: python -m pipeline.web.patch_lod
      - name: Stream weather and retain 5 m terrain under overlays
        run: python -m pipeline.web.patch_streaming
      - name: Add sliced-earth terrain base
        run: python -m pipeline.web.patch_earth_block
      - name: Fix dynamic overlays and match base colours
        run: python -m pipeline.web.patch_dynamic_fix
      - name: Keep terrain surface under wind and default trees off
        run: python -m pipeline.web.patch_wind_surface
      - name: Mask coarse weather overlay beneath fine terrain tiles
        run: python -m pipeline.web.patch_overlay_mask
      - name: Validate viewer JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("web/index.html").read_text()
          matches = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(matches) != 1:
              raise SystemExit(f"Expected one module script, found {len(matches)}")
          Path("/tmp/snowpack-viewer.mjs").write_text(matches[0])
          PY
          node --check /tmp/snowpack-viewer.mjs
      - name: Validate terrain LOD metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("web/data/lod/lod-meta.json").read_text())
          assert data["version"] == 1
          assert data["tiles"]
          assert Path("web/data/lod/coarse-20m.bin").exists()
          for tile in data["tiles"]:
              path = Path("web") / tile["path"].removeprefix("./")
              if not path.exists():
                  raise SystemExit(f"Missing LOD tile: {path}")
          print(f"terrain LOD ready: {len(data['tiles'])} fine tiles")
          PY
      - name: Validate browser weather metadata and chunks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/data/weather-meta.json")
          data = json.loads(
              path.read_text(),
              parse_constant=lambda value: (_ for _ in ()).throw(
                  ValueError(f"Non-standard JSON value: {value}")
              ),
          )
          chunks = data["chunks"]
          root = Path("web/data/weather-chunks")
          for chunk in range(chunks["count"]):
              index = f"{chunk:02d}"
              for name in ("wind-speed", "wind-direction", "shortwave"):
                  assert (root / f"{name}-{index}.bin").exists()
              for window in ("3", "6", "12", "24", "storm"):
                  assert (root / f"snow-{window}-{index}.bin").exists()
          print(f"weather-meta.json is strict JSON; {chunks['count']} streamed chunks ready")
          PY
      - name: Show hourly forcing summary
        run: |
          head -n 8 data/processed/furanodake/weather/2025-12-29_2026-01-03/forcing-summary.csv
          tail -n 8 data/processed/furanodake/weather/2025-12-29_2026-01-03/forcing-summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: furanodake-historical-weather-poc
          path: |
            data/processed/furanodake/weather/2025-12-29_2026-01-03/
            data/processed/furanodake/terrain/metadata.json
            web/index.html
            web/README.md
            web/data/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare Pages site
        run: touch web/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy-pages:
    needs: build-historical-weather
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
