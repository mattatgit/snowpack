[project]
name = "snowpack-poc"
version = "0.1.0"
description = "Mountain snow-state modelling proof of concept"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "rasterio>=1.4",
  "pyproj>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
